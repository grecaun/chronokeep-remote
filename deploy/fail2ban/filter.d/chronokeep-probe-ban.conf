# fail2ban filter for Chronokeep's probe bans.
#
# Chronokeep Results and Chronokeep Remote log one line each time they ban an IP for asking
# for a path only an exploit scanner would (.env, .php, .git, wp-admin and so on):
#
#   time="2026-11-18T19:55:42-08:00" level=warning msg="Banned 203.0.113.5 for 24h0m0s after it asked for \"/.env\"."
#
# Both APIs use this same filter. The requested path is quoted by the logger, so it can't
# be used to fake a ban line for another address.

[Definition]

failregex = level=warning msg="Banned <ADDR> for [0-9]

ignoreregex =
